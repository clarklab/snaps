<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>Snaps Quest</title>
    <meta
      name="description"
      content="Collect nine photos of nine colors. A local-first color photo game for iOS and Android."
    />

    <!-- iOS standalone / native feel -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Snaps Quest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />

    <!-- Preload the regular weight so first text paint isn't blocked by
         the font fetch. The other weights load lazily via @font-face. -->
    <link
      rel="preload"
      href="/fonts/GoogleSansFlex-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- theme-color flips with the active scheme; JS keeps it in sync too -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0c0e" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
